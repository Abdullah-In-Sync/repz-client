name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
        env:
          NUXT_PUBLIC_API_BASE: http://localhost:8000
          NUXT_PUBLIC_FIREBASE_API_KEY: test
          NUXT_PUBLIC_FIREBASE_AUTH_DOMAIN: test.firebaseapp.com
          NUXT_PUBLIC_FIREBASE_PROJECT_ID: test
          NUXT_PUBLIC_FIREBASE_STORAGE_BUCKET: test
          NUXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '1'
          NUXT_PUBLIC_FIREBASE_APP_ID: '1'
          NUXT_PUBLIC_FIREBASE_MEASUREMENT_ID: G-TEST
